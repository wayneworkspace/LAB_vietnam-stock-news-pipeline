services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.7   # pinned; upgrade on purpose (back up the n8n_data volume first)
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Bangkok
      - TZ=Asia/Bangkok
      - N8N_RUNNERS_ENABLED=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/data   # lets nodes read the JSON files in /data (for example to upload to Drive)
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data
    depends_on:
      pyworker:
        condition: service_healthy

  pyworker:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-pyworker:local
    container_name: pyworker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # reachable from this machine only; n8n calls http://pyworker:8000
    env_file:
      - .env
    environment:
      - DUCKDB_PATH=/data/stock.duckdb
      - RAW_DIR=/data/bronze/json
    volumes:
      - ./python:/app
      - ./data:/data
    healthcheck:   # the slim image has no curl, so use Python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  n8n_data:
